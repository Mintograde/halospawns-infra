components:
  terraform:
    map-processing:
      metadata:
        component: map-processing
      vars:
        release:
          retention:
            expiration_days: 90
            noncurrent_version_expiration_days: 30
            abort_incomplete_multipart_days: 7
        replay_parser:
          environment_variables:
            REPLAY_EXTRACTOR_MODE: native_with_fallback
            SPATIAL_OCCUPANCY_CELL_SIZE: "0.5"

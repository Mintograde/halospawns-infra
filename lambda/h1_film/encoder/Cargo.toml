[package]
name = "h1-film-encoder"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
h1-pose-codec = { path = "../pose_codec" }
ahash = "0.8"
indexmap = "2.14"
jsonschema = { version = "0.58.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order", "raw_value"] }
sha2 = "0.10"
ryu = "1.0"
zstd = "0.13"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

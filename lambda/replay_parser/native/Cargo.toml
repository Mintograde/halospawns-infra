[package]
name = "replay-extractor"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order", "raw_value"] }
sha2 = "0.10"
ryu = "1.0"
zstd = "0.13"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
